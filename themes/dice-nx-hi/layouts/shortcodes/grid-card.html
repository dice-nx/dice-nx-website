<div class="col-12 col-md-4 mb-4 d-flex">
  <div class="card flex-fill" style="width: 100%;">
    <div class="card-body">
      <div class="h5 card-title">
          <svg class="bi" width="32" height="32" fill="currentColor" aria-hidden="true">
          <use xlink:href="{{ "/bootstrap-icons.svg#" | relURL }}{{ .Get 0 }}"/>
          </svg>
          {{ .Get 1 }}
      </div>
      <p class="card-text">{{ .Inner | markdownify }}</p>
    </div>
  </div>
</div>
